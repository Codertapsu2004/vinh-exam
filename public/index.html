<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINH EXAM</title><style>
:root{--p:#4f6df5;--p2:#7c3aed;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e7eaf2;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.top{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:white}.spacer{flex:1}.app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 66px)}aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px}nav button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:10px;margin:2px 0;cursor:pointer;color:#465066}nav button:hover,nav button.active{background:#eef2ff;color:#314bc4;font-weight:700}.main{padding:28px;max-width:1200px;width:100%}.hero{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #dde4ff;border-radius:22px;padding:28px;margin-bottom:20px}.hero h1{margin:4px 0 8px;font-size:30px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(20,30,60,.04)}.stat b{font-size:28px;display:block;margin-top:7px}.btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:var(--p);color:#fff}.soft{background:#eef2ff;color:#314bc4}.danger{background:#fee2e2;color:#b91c1c}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);padding:14px;border-radius:13px;display:flex;gap:12px;align-items:center}.item .grow{flex:1}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#f1f5f9}.badge.ok{background:#dcfce7;color:#166534}.badge.warn{background:#fef3c7;color:#92400e}.field{display:grid;gap:6px;margin-bottom:12px}.field input,.field select,.field textarea{border:1px solid #d8ddea;border-radius:10px;padding:10px 11px;background:white}.modal{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:18px;z-index:50}.box{background:#fff;border-radius:18px;width:min(640px,100%);padding:22px;max-height:90vh;overflow:auto}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#eef2ff,#faf5ff)}.login .box{width:min(430px,calc(100% - 28px));box-shadow:0 30px 80px #4f46e520}.q{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.q label{display:block;padding:7px 0}.timer{font-weight:800;font-size:18px;color:#b45309}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:white;padding:12px 15px;border-radius:10px;z-index:100}.empty{text-align:center;padding:34px;color:var(--muted)}@media(max-width:800px){.app{grid-template-columns:1fr}aside{display:none}.main{padding:16px}.grid{grid-template-columns:1fr}.top{padding:0 14px}}
</style></head><body>
<div id="toast" class="toast hidden"></div><div id="login" class="login"><div class="box"><div class="brand"><div class="logo">V</div><div><div>VINH EXAM</div><small class="muted">Hệ thống thi trực tuyến</small></div></div><h2>Đăng nhập</h2><div class="field"><label>Tên đăng nhập</label><input id="loginName" autocomplete="username"></div><div class="field"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%" onclick="doLogin()">Đăng nhập</button><p class="muted" style="font-size:13px">Tài khoản được quản lý trên máy chủ. Dữ liệu bài làm lưu trong PostgreSQL.</p></div></div>
<div id="shell" class="hidden"><header class="top"><div class="brand"><div class="logo">V</div><span>VINH EXAM</span></div><div class="spacer"></div><span id="who" class="muted"></span><button class="btn soft" onclick="logout()">Đăng xuất</button></header><div class="app"><aside><nav id="nav"></nav></aside><main id="main" class="main"></main></div></div><div id="modalRoot"></div>
<script>
let ME=null, timerHandle=null;const $=s=>document.querySelector(s);function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}async function api(path,opt={}){const r=await fetch('/api'+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'Có lỗi xảy ra');return d}function fmt(d){return d?new Date(d).toLocaleString('vi-VN'):''}
async function boot(){try{ME=(await api('/auth/me')).user;showShell()}catch{$('#login').classList.remove('hidden')}}async function doLogin(){try{ME=(await api('/auth/login',{method:'POST',body:JSON.stringify({login:$('#loginName').value,password:$('#password').value})})).user;showShell()}catch(e){toast(e.message)}}async function logout(){await api('/auth/logout',{method:'POST'}).catch(()=>{});location.reload()}
function showShell(){$('#login').classList.add('hidden');$('#shell').classList.remove('hidden');$('#who').textContent=ME.name+' · '+({student:'Học sinh',teacher:'Giáo viên',admin:'Quản trị'}[ME.role]);renderNav();route('home')}
function renderNav(){const maps={student:[['home','⌂ Tổng quan'],['history','◫ Lịch sử']],teacher:[['home','⌂ Tổng quan'],['classes','♙ Lớp học'],['exams','▦ Kho đề'],['assign','＋ Giao bài'],['grade','✓ Chấm bài']],admin:[['home','⌂ Tổng quan'],['users','♙ Tài khoản']]};$('#nav').innerHTML=maps[ME.role].map(x=>`<button data-r="${x[0]}" onclick="route('${x[0]}')">${x[1]}</button>`).join('')}
async function route(r){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.r===r));if(ME.role==='student')return studentRoute(r);if(ME.role==='teacher')return teacherRoute(r);return adminRoute(r)}
async function studentRoute(r){const d=await api('/student/dashboard');if(r==='history'){const rows=d.assignments.filter(x=>x.attempt_id);return page('Lịch sử làm bài',rows.map(x=>item(`<b>${x.title}</b><div class="muted">${x.class_name} · ${x.status}</div>`,x.score!=null?`<span class="badge ok">${x.score} điểm</span>`:'' )).join('')||empty())}const open=d.assignments;page('Tổng quan học sinh',`<section class="hero"><div class="muted">KHU VỰC HỌC SINH</div><h1>Chào ${ME.name}</h1><p>Bài được giao, trạng thái làm bài và kết quả đều lấy trực tiếp từ máy chủ.</p></section><h2>Bài được giao</h2><div class="list">${open.map(x=>item(`<b>${x.title}</b><div class="muted">${x.class_name} · ${fmt(x.open_at)} → ${fmt(x.close_at)}</div>`,x.attempt_id?`<button class="btn soft" onclick="${x.status==='in_progress'?`openAttempt('${x.attempt_id}')`:`showResult('${x.attempt_id}')`}">${x.status==='in_progress'?'Tiếp tục':'Xem kết quả'}</button>`:`<button class="btn primary" onclick="startExam('${x.assignment_id}')">Vào thi</button>`)).join('')||empty()}</div>`)}
async function startExam(id){try{const d=await api('/student/start/'+id,{method:'POST'});openAttempt(d.attemptId)}catch(e){toast(e.message)}}async function openAttempt(id){const d=(await api('/student/attempt/'+id)).attempt;let answers=d.answers||{};const renderQ=(q,i)=>`<div class="q"><b>Câu ${i+1}. ${q.text}</b>${q.type==='single'?q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${j}" ${String(answers[q.id])===String(j)?'checked':''} onchange="saveAns('${q.id}',${j})"> ${o}</label>`).join(''):q.type==='tf'?q.statements.map((s,j)=>`<div class="row" style="margin-top:7px"><span class="grow">${s}</span><select onchange="saveTF('${q.id}',${j},this.value)"><option value="">—</option><option value="true" ${answers[q.id]?.[j]===true?'selected':''}>Đúng</option><option value="false" ${answers[q.id]?.[j]===false?'selected':''}>Sai</option></select></div>`).join(''):q.type==='number'?`<input style="margin-top:10px;width:180px" value="${answers[q.id]??''}" oninput="saveText('${q.id}',this.value,true)">`: `<textarea rows="6" style="margin-top:10px;width:100%" oninput="saveText('${q.id}',this.value,false)">${answers[q.id]??''}</textarea>`}</div>`;window._attempt={id,answers,deadline:d.deadlineAt};page(d.examTitle,`<div class="row"><span class="badge">${d.title}</span><span class="timer" id="timer"></span><span class="spacer"></span><button class="btn primary" onclick="submitExam()">Nộp bài</button></div>${d.questions.map(renderQ).join('')}`);if(timerHandle)clearInterval(timerHandle);const tick=()=>{const s=Math.max(0,Math.floor((new Date(d.deadlineAt)-Date.now())/1000));$('#timer').textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(s<=0){clearInterval(timerHandle);submitExam()}};tick();timerHandle=setInterval(tick,1000)}
let saveDelay;function saveAns(id,v){_attempt.answers[id]=v;queueSave()}function saveTF(id,i,v){if(!Array.isArray(_attempt.answers[id]))_attempt.answers[id]=[];_attempt.answers[id][i]=v===''?null:v==='true';queueSave()}function saveText(id,v,num){_attempt.answers[id]=num?(v===''?null:Number(v)):v;queueSave()}function queueSave(){clearTimeout(saveDelay);saveDelay=setTimeout(async()=>{try{await api('/student/attempt/'+_attempt.id+'/save',{method:'POST',body:JSON.stringify({answers:_attempt.answers})});toast('Đã lưu')}catch(e){toast(e.message)}},500)}async function submitExam(){if(!_attempt)return;try{await api('/student/attempt/'+_attempt.id+'/save',{method:'POST',body:JSON.stringify({answers:_attempt.answers})}).catch(()=>{});await api('/student/attempt/'+_attempt.id+'/submit',{method:'POST'});toast('Đã nộp bài');showResult(_attempt.id)}catch(e){toast(e.message)}}async function showResult(id){const r=(await api('/student/result/'+id)).result;page('Kết quả',`<div class="card"><h2>${r.exam_title}</h2><p>${r.title}</p><p>Trạng thái: <b>${r.status==='graded'?'Đã chấm':'Chờ giáo viên chấm'}</b></p>${r.score!=null?`<div style="font-size:44px;font-weight:900;color:var(--p)">${r.score}</div><div class="muted">điểm</div>`:''}${r.manual_comment?`<p><b>Nhận xét:</b> ${r.manual_comment}</p>`:''}<button class="btn soft" onclick="route('home')">Về tổng quan</button></div>`)}
async function teacherRoute(r){if(r==='classes'){const d=await api('/teacher/classes');return page('Lớp học',`<button class="btn primary" onclick="classModal()">＋ Tạo lớp</button><div class="list" style="margin-top:14px">${d.classes.map(x=>item(`<b>${x.name}</b><div class="muted">${x.subject}</div>`,`<span class="badge">${x.students} HS</span>`)).join('')||empty()}</div>`)}if(r==='exams'){const d=await api('/teacher/exams');return page('Kho đề',`<button class="btn primary" onclick="examModal()">＋ Tạo đề</button><div class="list" style="margin-top:14px">${d.exams.map(x=>item(`<b>${x.title}</b><div class="muted">${x.subject} · ${x.duration} phút</div>`,`<span class="badge ok">${x.status}</span>`)).join('')||empty()}</div>`)}if(r==='assign')return assignPage();if(r==='grade'){const d=await api('/teacher/pending');return page('Chấm tự luận',`<div class="list">${d.attempts.map(x=>item(`<b>${x.name}</b><div class="muted">${x.title} · Điểm tự động ${x.score}</div>`,`<button class="btn primary" onclick="gradeModal('${x.id}')">Chấm</button>`)).join('')||empty()}</div>`)}const d=await api('/teacher/dashboard');page('Tổng quan giáo viên',`<section class="hero"><div class="muted">KHU VỰC GIÁO VIÊN</div><h1>Quản lý bài thi</h1><p>Tạo lớp, tạo đề, giao bài và chấm trên dữ liệu thật.</p></section><div class="grid"><div class="card stat">Lớp học<b>${d.stats.classes}</b></div><div class="card stat">Đề thi<b>${d.stats.exams}</b></div><div class="card stat">Chờ chấm<b>${d.stats.pending}</b></div></div>`)}
function classModal(){modal(`<h2>Tạo lớp</h2><div class="field"><label>Tên lớp</label><input id="cname" value="11A2"></div><div class="field"><label>Môn</label><input id="csub" value="Vật lí 11"></div><button class="btn primary" onclick="createClass()">Lưu</button>`)}async function createClass(){try{await api('/teacher/classes',{method:'POST',body:JSON.stringify({name:$('#cname').value,subject:$('#csub').value})});closeModal();route('classes')}catch(e){toast(e.message)}}
function examModal(){modal(`<h2>Tạo đề nhanh</h2><div class="field"><label>Tên đề</label><input id="etitle" value="Đề kiểm tra mới"></div><div class="field"><label>Môn</label><input id="esub" value="Vật lí 11"></div><div class="field"><label>Thời gian (phút)</label><input id="edur" type="number" value="45"></div><p class="muted">Bản live hiện hỗ trợ tạo vỏ đề qua UI; bộ soạn 4 dạng câu đầy đủ đang được nối tiếp từ source V1.</p><button class="btn primary" onclick="createExam()">Tạo đề</button>`)}async function createExam(){try{await api('/teacher/exams',{method:'POST',body:JSON.stringify({title:$('#etitle').value,subject:$('#esub').value,duration:+$('#edur').value,maxScore:10,questions:[]})});closeModal();route('exams')}catch(e){toast(e.message)}}
async function assignPage(){const [c,e,a]=await Promise.all([api('/teacher/classes'),api('/teacher/exams'),api('/teacher/assignments')]);page('Giao bài',`<button class="btn primary" onclick='assignModal(${JSON.stringify(c.classes).replaceAll("'","&apos;")},${JSON.stringify(e.exams).replaceAll("'","&apos;")})'>＋ Giao bài</button><div class="list" style="margin-top:14px">${a.assignments.map(x=>item(`<b>${x.title}</b><div class="muted">${x.class_name} · ${x.exam_title}</div>`,`<span class="badge">${x.attempts} lượt</span>`)).join('')||empty()}</div>`)}function assignModal(classes,exams){modal(`<h2>Giao bài</h2><div class="field"><label>Lớp</label><select id="aclass">${classes.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></div><div class="field"><label>Đề</label><select id="aexam">${exams.map(x=>`<option value="${x.id}">${x.title}</option>`).join('')}</select></div><div class="field"><label>Tên bài</label><input id="atitle" value="Bài kiểm tra"></div><button class="btn primary" onclick="createAssign()">Giao ngay</button>`)}async function createAssign(){try{await api('/teacher/assignments',{method:'POST',body:JSON.stringify({classId:$('#aclass').value,examId:$('#aexam').value,title:$('#atitle').value})});closeModal();route('assign')}catch(e){toast(e.message)}}function gradeModal(id){modal(`<h2>Chấm tự luận</h2><div class="field"><label>Điểm phần tự luận</label><input id="gpoint" type="number" step="0.25" value="0"></div><div class="field"><label>Nhận xét</label><textarea id="gcomment"></textarea></div><button class="btn primary" onclick="doGrade('${id}')">Lưu điểm</button>`)}async function doGrade(id){try{await api('/teacher/grade/'+id,{method:'POST',body:JSON.stringify({points:+$('#gpoint').value,comment:$('#gcomment').value})});closeModal();route('grade')}catch(e){toast(e.message)}}
async function adminRoute(r){if(r==='users'){const d=await api('/admin/users');return page('Tài khoản',`<div class="list">${d.users.map(x=>item(`<b>${x.name}</b><div class="muted">${x.login}</div>`,`<span class="badge">${x.role}</span>`)).join('')}</div>`)}const d=await api('/admin/dashboard');const users=Object.fromEntries(d.users.map(x=>[x.role,x.n]));page('Quản trị VINH EXAM',`<section class="hero"><div class="muted">QUẢN TRỊ HỆ THỐNG</div><h1>Tổng quan vận hành</h1></section><div class="grid"><div class="card stat">Học sinh<b>${users.student||0}</b></div><div class="card stat">Giáo viên<b>${users.teacher||0}</b></div><div class="card stat">Lượt thi<b>${d.attempts}</b></div></div>`)}
function page(title,html){$('#main').innerHTML=`<div class="row"><h1 style="margin-right:auto">${title}</h1></div>${html}`}function item(a,b=''){return `<div class="item"><div class="grow">${a}</div>${b}</div>`}function empty(){return `<div class="empty">Chưa có dữ liệu</div>`}function modal(html){$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box">${html}<div style="margin-top:14px"><button class="btn soft" onclick="closeModal()">Đóng</button></div></div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}boot();
</script></body></html>
